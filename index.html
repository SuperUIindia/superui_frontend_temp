<!DOCTYPE html>

    <!--
      SuperUI - pre-render SEO / AEO / GEO defaults.
      These values are the floor: crawlers and answer engines that never execute
      JavaScript read exactly this. At runtime frontend/src/lib/seo.js overrides
      them with the database-driven `seo` section and injects the JSON-LD graph.
      Keep this file in sync with frontend/.env (VITE_DEFAULT_TITLE etc.) and with
      frontend/public/robots.txt, sitemap.xml and llms.txt - the brand, city and
      region must not drift apart between those files.
    -->
    <title>SuperUI &#8212; Web Development, UI/UX Design &amp; Custom Software Studio</title>
    <meta
      name="description"
      content="SuperUI is a full-stack web development and UI/UX design studio in Warangal, Telangana, India. We build fast, secure, SEO-optimised websites, e-commerce stores and custom web applications. Get a fixed-price proposal within 24 hours."
    />
    <!--
      Keywords: focused set of 12 high-intent phrases for the target audience.
      Google does not use this for ranking but Bing still considers it lightly;
      more importantly, a clean list avoids the keyword-stuffing penalty signal.
    -->
    <meta
      name="keywords"
      content="web development company Warangal, UI UX design services India, custom web application development, ecommerce website development, React Next.js developers India, website maintenance SEO services, admin dashboard development, Node.js Express API development, SuperUI, SuperUI Warangal"
    />

    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <meta name="rating" content="general" />
    <meta name="theme-color" content="#FF5E00" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="generator" content="SuperUI" />

    <!-- Canonical / hreflang -->

    <link rel="alternate" hreflang="x-default" href="https://superui.in/" />
    <link rel="alternate" hreflang="en-IN" href="https://superui.in/" />

    <!--
      GEO / local SEO. geo.region, geo.placename and geo.position are read by
      Google, Bing and several AI answer engines to place the business.
    -->
    <meta name="geo.region" content="IN-TG" />
    <meta name="geo.placename" content="Warangal, Telangana, India" />
    <meta name="geo.position" content="17.9689;79.5941" />
    <meta name="ICBM" content="17.9689, 79.5941" />

    <!-- Open Graph / Facebook -->

    <meta property="og:url" content="https://superui.in/" />
    <meta property="og:site_name" content="SuperUI" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="SuperUI &#8212; Web Development, UI/UX Design &amp; Custom Software Studio" />

      property="og:description"
      content="A full-stack engineering and design studio in Warangal, Telangana delivering high-speed web apps, e-commerce stores, custom software and conversion-optimised websites. Fixed-price proposals within 24 hours."

    <meta property="og:image:alt" content="SuperUI — Web Development & UI/UX Design Studio logo" />

      og:image:width / og:image:height are intentionally omitted here because
      superui_logo.png is a square logo, not a 1200×630 banner. Declaring wrong
      dimensions causes social-card validators to warn. Replace these with correct
      values once a proper 1200×630 OG banner is created.
    -->

    <link rel="apple-touch-icon" href="/superui_logo.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Preload the logo so it is not discovered late in the render chain.
      This is the Largest Contentful Paint candidate on most viewport sizes.
    -->
    <link rel="preload" as="image" href="/superui_logo.png" />

    <!--
      Google Fonts: loaded synchronously rather than with the
      `media="print" onload="this.media='all'"` trick needs an inline event
      handler, which a strict script-src CSP blocks. preconnect still removes the
      DNS + TLS cost, so this costs one render-blocking request and nothing else.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    />
