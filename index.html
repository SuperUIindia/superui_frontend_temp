<!DOCTYPE html>
<html lang="en">
  <head>

    <!--
      SuperUI - pre-render SEO / AEO / GEO defaults.
      These values are the floor: crawlers and answer engines that never execute
      JavaScript read exactly this. At runtime frontend/src/lib/seo.js overrides
      them with the database-driven `seo` section and injects the JSON-LD graph.
      Keep this file in sync with frontend/.env (VITE_DEFAULT_TITLE etc.) and with
      frontend/public/robots.txt, sitemap.xml and llms.txt - the brand, city and
      region must not drift apart between those files.
    -->
    <title>SuperUI — Web Development, UI/UX Design &amp; Custom Software Studio</title>
    <meta
      name="description"
      content="SuperUI is a full-stack web development and UI/UX design studio in Warangal, Telangana, India. We build fast, secure, SEO-optimised websites, e-commerce stores and custom web applications. Get a fixed-price proposal within 24 hours."
    />
    <!-- <meta
      name="keywords"
      content="web development company Warangal, custom web application development, UI UX design services India, ecommerce website development, React and Next.js developers, website maintenance and SEO services, SuperUI"
    /> -->
    <meta
  name="keywords"
  content="SuperUI, UI, UI Design, UI Components, web development company Warangal, UI Kit, UI Templates, Web Design, Web Development, React, ReactJS, React Components, React Templates, Frontend, Frontend Development, JavaScript, Web Templates, Website Templates, Landing Page, Landing Page Design, SaaS, SaaS UI, Dashboard UI, Admin Dashboard, Portfolio Template, Portfolio Design, Developer Resources, Design Resources, Digital Products, Digital Assets, Coding, Programming, Software Development, Tech, Tech Design, UX, UX Design, Responsive Design, Modern UI, Premium UI, Design Inspiration, Web Designer, Web Developer, Developers, Design Community, React Developer, Frontend Developer, Indie Hacker, Startup, SaaS Products, DevTools, web development company Warangal, web development company India, custom web application development, UI UX design services India, ecommerce website development, React and Next.js developers, website maintenance and SEO services"
/>

    <meta name="rating" content="general" />
    <meta name="theme-color" content="#FF5E00" />
    <meta name="color-scheme" content="light" />

    <!--
      Google Fonts: Plus Jakarta Sans & Inter.
      Loaded with a plain blocking stylesheet link: the usual
      `media="print" onload="this.media='all'"` trick needs an inline event
      handler, which a strict script-src CSP blocks. preconnect still removes the
      DNS + TLS cost, so this costs one render-blocking request and nothing else.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    />

    <!--
      JSON-LD. The runtime graph in frontend/src/lib/seo.js is richer and
      includes a live Service catalogue, FAQPage and BreadcrumbList; this static
      graph is the fallback for non-JS crawlers and must not be removed.
      A JSON-LD data block is not executed, so it is not blocked by the
      `script-src 'self'` Content-Security-Policy set in vercel.json.
    -->
    <script type="application/ld+json">

            },

              "longitude": 79.5941
            },
            "areaServed": [
              { "@type": "Country", "name": "India" },
              { "@type": "Country", "name": "United Arab Emirates" },

            }
          },
          {
            "@type": "WebSite",
            "@id": "https://superui.in/#website",
            "url": "https://superui.in/",
            "name": "SuperUI",
            "inLanguage": "en-IN",
            "publisher": { "@id": "https://superui.in/#organization" }
          },
          {
            "@type": "WebPage",
            "@id": "https://superui.in/#webpage",
            "url": "https://superui.in/",
            "name": "SuperUI — Web Development, UI/UX Design & Custom Software Studio",
            "isPartOf": { "@id": "https://superui.in/#website" },
            "about": { "@id": "https://superui.in/#organization" },
            "inLanguage": "en-IN",
            "speakable": {
              "@type": "SpeakableSpecification",

          {

            "serviceType": [
              "Website Development",
              "E-commerce Development",
              "UI/UX & Design",
              "React & Frontend Development",
              "Backend & API Development",
              "Website Maintenance",
              "Security Services",
              "Cloud & Deployment",
              "SEO & Digital Marketing",
              "Automation"
            ]
          },
          {
            "@type": "FAQPage",
            "@id": "https://superui.in/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What does SuperUI do?",
