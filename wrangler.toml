# Cloudflare Workers configuration for serving the SuperUI SPA as static assets.
#
# This file is used when deploying via `npx wrangler deploy` (the command the
# CI pipeline runs). It tells Wrangler to serve the Vite build output from
# dist/ as static assets attached to a Worker.
#
# For Cloudflare Pages deployments, use `npx wrangler pages publish dist`
# instead — that command reads the [pages] section, not [assets].
#
# SPA routing: Workers with assets serves index.html for any URL that does not
# match a real file. This is the default behaviour and does NOT need a
# _redirects rule. The old _redirects file contained `/*  /index.html  200`,
# which created an infinite loop (error 100324) because /index.html itself
# matches /*. That file is now documentation-only.

name = "superui-frontend-temp"
compatibility_date = "2025-10-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"